name: "Release: beta"

on:
  push:
    branches: [ develop ]

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  detect-changeset-change:
    name: Detect changeset change
    runs-on: ubuntu-latest
    needs: [ check ]
    outputs:
      should_publish_beta: ${{ steps.detect.outputs.should_publish_beta }}
    permissions:
      contents: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect semantic changeset changes
        id: detect
        env:
          AFTER: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_publish_beta=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet --diff-filter=AM "$BEFORE" "$AFTER" -- .changeset ':(exclude).changeset/README.md'; then
            echo "should_publish_beta=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_beta=true" >> "$GITHUB_OUTPUT"
          fi

  release-beta:
    name: "Release: beta"
    needs: [ detect-changeset-change ]
    if: needs.detect-changeset-change.outputs.should_publish_beta == 'true'
    uses: ./.github/workflows/release.yml
    with:
      snapshot: true
      concurrency-group: release-beta
