name: "Release: beta"

on:
  push:
    branches: [ develop ]

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  detect-changeset-change:
    name: Detect changeset change
    runs-on: ubuntu-latest
    needs: [ check ]
    outputs:
      should_publish_beta: ${{ steps.detect.outputs.should_publish_beta }}
    permissions:
      contents: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect semantic changeset changes
        id: detect
        env:
          AFTER: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_publish_beta=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet --diff-filter=AM "$BEFORE" "$AFTER" -- .changeset ':(exclude).changeset/README.md'; then
            echo "should_publish_beta=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_beta=true" >> "$GITHUB_OUTPUT"
          fi

  release-beta:
    name: "Release: beta"
    runs-on: ubuntu-latest
    needs: [ detect-changeset-change ]
    if: needs.detect-changeset-change.outputs.should_publish_beta == 'true'
    concurrency:
      group: release-beta
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate beta snapshot
        run: bun changeset version --snapshot beta

      - name: Publish beta to npm
        run: bun changeset publish --tag beta --no-git-tag
