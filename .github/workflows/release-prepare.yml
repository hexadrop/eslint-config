name: Prepare release

on:
  push:
    branches: [ develop ]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release-prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    needs: [ check ]
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    permissions:
      contents: 'write'
      pull-requests: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture release version
        id: release-version
        shell: bash
        run: |
          shopt -s nullglob

          for changeset in .changeset/*.md; do
            if [[ "$changeset" == ".changeset/README.md" ]]; then
              continue
            fi

            bun changeset status --output=release.json
            version="$(jq -r '.releases[0].newVersion // empty' release.json)"
            rm release.json

            if [[ -n "$version" ]]; then
              echo "has-release=true" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
            else
              echo "has-release=false" >> "$GITHUB_OUTPUT"
            fi

            exit 0
          done

          echo "has-release=false" >> "$GITHUB_OUTPUT"

      - name: Build types
        run: bun build:types
        if: steps.release-version.outputs.has-release == 'true'

      - name: Create or update release pull request
        if: steps.release-version.outputs.has-release == 'true'
        uses: changesets/action@v2.1.0
        with:
          version-script: bun changeset version
          pr-base-branch: main
          pr-draft: always
          commit-message: 'chore: release v${{ steps.release-version.outputs.version }}'
          pr-title: 'chore: release v${{ steps.release-version.outputs.version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
