name: "Release: prepare"

on:
  push:
    branches: [ develop ]

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  release-prepare:
    name: "Release: prepare"
    runs-on: ubuntu-latest
    needs: [ check ]
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    permissions:
      contents: 'write'
      pull-requests: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture release version
        id: release-version
        shell: bash
        run: |
          shopt -s nullglob

          for changeset in .changeset/*.md; do
            if [[ "$changeset" == ".changeset/README.md" ]]; then
              continue
            fi

            if bun changeset status --output=release.json; then
              version="$(jq -r '.releases[0].newVersion // empty' release.json)"
              rm release.json

              if [[ -n "$version" ]]; then
                echo "has-release=true" >> "$GITHUB_OUTPUT"
                echo "version=$version" >> "$GITHUB_OUTPUT"
              else
                echo "has-release=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "has-release=false" >> "$GITHUB_OUTPUT"
            fi

            exit 0
          done

          echo "has-release=false" >> "$GITHUB_OUTPUT"

      - name: Build types
        run: bun build:types
        if: steps.release-version.outputs.has-release == 'true'

      - name: Create or update release pull request
        if: steps.release-version.outputs.has-release == 'true'
        uses: changesets/action@v2.1.1
        with:
          version-script: bun changeset version
          pr-base-branch: main
          pr-draft: always
          commit-message: 'chore: release v${{ steps.release-version.outputs.version }}'
          pr-title: 'chore: release v${{ steps.release-version.outputs.version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release label to release pull request
        if: steps.release-version.outputs.has-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "Release pull request not found. Skipping."
            exit 0
          fi

          gh pr edit "$pr_number" --add-label release

      - name: Add merge reminder to release pull request
        if: steps.release-version.outputs.has-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head changeset-release/main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "Release pull request not found. Skipping."
            exit 0
          fi

          reminder_exists="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --jq 'any(.[].body; contains("Merge this pull request using"))')"
          if [[ "$reminder_exists" == false ]]; then
            gh pr comment "$pr_number" --body "> [!IMPORTANT]
> Merge this pull request using **Create a merge commit** so main keeps the full history from develop."
          fi
